name: Bootstrap complete Thomas Lab source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part1-*.b64 | base64 --decode > /tmp/thomaslab-source.zip
          mkdir -p /tmp/thomaslab-source
          unzip -q /tmp/thomaslab-source.zip -d /tmp/thomaslab-source

      - name: Replace preview-only repository with full source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' /tmp/thomaslab-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Part 1/6: restore full editable source and responsive foundation"
            git push
          fi
