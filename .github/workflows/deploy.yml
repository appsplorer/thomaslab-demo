name: Deploy Thomas Lab website

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      payload:
        description: Optional Pages CMS action payload
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Validate source
        run: |
          node --check scripts/build.mjs
          node --check assets/js/site.js
          node scripts/check.mjs
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          node scripts/build.mjs
          node scripts/check-output.mjs
      - name: Archive Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory "_site" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.well-known/security.txt'
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -Fx './.nojekyll'
      - name: Upload Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
